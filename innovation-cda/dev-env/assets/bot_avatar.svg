<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40">
  <rect width="100" height="100" rx="24" fill="#F5A623"/>
  <!-- Antenna -->
  <line x1="50" y1="20" x2="50" y2="28" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <circle cx="50" cy="18" r="4" fill="#FFFFFF"/>
  <!-- Robot head -->
  <rect x="26" y="28" width="48" height="44" rx="10" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <!-- Ears -->
  <rect x="18" y="44" width="7" height="12" rx="3" fill="#FFFFFF"/>
  <rect x="75" y="44" width="7" height="12" rx="3" fill="#FFFFFF"/>
  <!-- Eyes -->
  <circle cx="41" cy="46" r="4.5" fill="#FFFFFF"/>
  <circle cx="59" cy="46" r="4.5" fill="#FFFFFF"/>
  <!-- Mouth -->
  <line x1="38" y1="58" x2="62" y2="58" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
</svg>
